<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Teams - PokeTeam</title>
    <link rel="stylesheet" href="../stylesheets/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gray-100 p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-8 gap-4 flex-wrap">
            <div class="flex items-center gap-4">
                <a href="home.html" class="p-3 bg-white rounded-full shadow-md border-2 border-gray-200 hover:bg-gray-50 transition-colors block">
                    <i data-lucide="arrow-left" class="w-6 h-6 text-gray-600"></i>
                </a>
                <h1 class="text-4xl font-black text-gray-900 uppercase tracking-wider flex items-center gap-3">
                    <i data-lucide="users" class="w-10 h-10 text-red-500"></i> My Pokemon Teams
                </h1>
            </div>

            <button onclick="toggleCreateTeamForm()" class="flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-3 rounded-xl shadow-lg border-b-4 border-green-700 active:translate-y-1 active:border-b-0 transition-all uppercase">
                <i data-lucide="plus" class="w-5 h-5"></i> Add New Team
            </button>
        </div>

        <div id="create-team-panel" class="hidden bg-white rounded-2xl border-2 border-gray-200 shadow-md p-5 mb-8">
            <form id="create-team-form" class="flex flex-col md:flex-row gap-4 md:items-end" onsubmit="submitCreateTeam(event)">
                <div class="flex-1">
                    <label for="new-team-name" class="block text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">
                        Team Name
                    </label>
                    <input
                        id="new-team-name"
                        name="teamName"
                        type="text"
                        placeholder="Enter your new team name"
                        class="w-full bg-white border-2 border-gray-300 rounded-lg p-3 text-gray-800 font-medium focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all"
                        required
                    >
                </div>

                <div class="flex gap-3">
                    <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-3 rounded-xl shadow-md border-b-4 border-green-700 active:translate-y-1 active:border-b-0 transition-all uppercase">
                        Create Team
                    </button>
                    <button type="button" onclick="toggleCreateTeamForm(false)" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold px-6 py-3 rounded-xl shadow-sm border-b-4 border-gray-400 active:translate-y-1 active:border-b-0 transition-all uppercase">
                        Cancel
                    </button>
                </div>
            </form>
            <p id="create-team-error" class="hidden mt-3 text-sm font-bold text-red-600"></p>
        </div>

        <div id="teams-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <script src="../scripts/scripts.js"></script>
</body>
</html>
