<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - PokeTeam</title>
    <link rel="stylesheet" href="../stylesheets/style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen bg-gray-50 overflow-hidden">

    <div class="w-64 bg-white border-r-2 border-gray-200 flex flex-col z-30 shadow-md">
        <div class="p-4 bg-red-600 border-b-4 border-gray-900 text-white font-black uppercase text-xl text-center">
            Pokédex
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-3">
            <p class="text-sm font-bold text-gray-400 text-center uppercase tracking-wider mt-4">Database Loading...</p>
            </div>
    </div>

    <div class="flex-1 flex flex-col p-8 items-center justify-center relative bg-[url('https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center">
        <div class="absolute inset-0 bg-white/80 backdrop-blur-sm"></div>

        <div class="relative z-10 flex flex-col items-center text-center max-w-2xl">
            <div class="bg-red-500 text-white p-4 rounded-full border-4 border-gray-900 shadow-xl mb-8">
                <i data-lucide="users" class="w-16 h-16"></i>
            </div>
          
            <h1 class="text-5xl font-black text-gray-900 uppercase tracking-tighter mb-4 drop-shadow-sm">
                Welcome to <span class="text-red-600">PokeTeam</span>
            </h1>
          
            <p class="text-xl text-gray-700 font-medium mb-12">
                Browse the Pokédex on the left to learn about different Pokémon. 
                When you're ready, head over to the Teams page to start assembling your dream squad!
            </p>

            <a href="myTeams.html" class="flex items-center gap-2 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-black text-2xl px-8 py-5 rounded-2xl shadow-xl border-b-4 border-yellow-600 active:translate-y-1 active:border-b-0 active:mb-1 transition-all uppercase tracking-widest no-underline">
                My Teams <i data-lucide="chevron-right" class="w-8 h-8"></i>
            </a>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
