<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Frequency - PokeTeam</title>
    <link rel="stylesheet" href="../stylesheets/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex flex-col h-screen bg-gray-50 overflow-hidden" id="type-aggregate-view">
    <div id="nav-placeholder"></div>

    <div class="flex-1 overflow-y-auto p-6 relative">
        <div class="max-w-7xl mx-auto space-y-6">
            <div class="bg-white p-6 rounded-xl border-2 border-gray-200 shadow-sm flex items-center justify-between gap-4 flex-wrap">
                <div>
                    <h1 class="text-3xl font-black text-gray-900 uppercase tracking-wide flex items-center gap-3">
                        <i data-lucide="zap" class="text-red-600 w-8 h-8"></i>
                        Type Usage Frequency
                    </h1>
                    <p class="text-gray-600 font-medium mt-2">
                        Rank Pokemon types by how often they appear across all teams.
                    </p>
                </div>

            </div>

            <div class="bg-white rounded-xl shadow-md border-2 border-gray-200 overflow-hidden flex flex-col">
                <div class="p-4 bg-gray-100 border-b-2 border-gray-200 flex items-center gap-2">
                    <i data-lucide="table-2" class="w-5 h-5 text-gray-600"></i>
                    <h2 class="text-lg font-bold text-gray-800 uppercase tracking-wide">Type Frequency Results</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-gray-50 border-b-2 border-gray-200 text-xs font-bold text-gray-500 uppercase tracking-wider">
                                <th class="p-3">Rank</th>
                                <th class="p-3">Type ID</th>
                                <th class="p-3">Type</th>
                                <th class="p-3">Usage Count</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200 text-sm" id="type-frequency-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                if (window.lucide) lucide.createIcons();
            });
    </script>
    <script src="../scripts/scripts.js"></script>
</body>
</html>
