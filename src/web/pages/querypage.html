<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggregate Reports - PokeTeam</title>
    <link rel="stylesheet" href="../stylesheets/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex flex-col min-h-screen bg-gray-50">
    <div id="nav-placeholder"></div>

    <main class="flex-1 flex items-center justify-center p-8">
        <div class="max-w-2xl w-full bg-white rounded-2xl border-4 border-gray-900 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] p-8 text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-red-100 text-red-600 flex items-center justify-center">
                <i data-lucide="bar-chart-3" class="w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-black uppercase tracking-wide text-gray-900">Aggregate Reports Moved</h1>
            <p class="mt-3 text-gray-600 font-medium">
                This fallback page now points you to the live aggregate report pages backed by Flask routes.
            </p>
            <a href="speciescounter.html" class="inline-block mt-6 bg-red-500 hover:bg-red-600 text-white font-bold uppercase tracking-wider px-6 py-3 rounded-xl border-b-4 border-red-700 transition-all">
                Open Live Reports
            </a>
        </div>
    </main>

    <script>
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                if (window.lucide) {
                    lucide.createIcons();
                }
            });
    </script>
    <script src="../scripts/scripts.js"></script>
</body>
</html>
