<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - PokeTeam</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">PokeTeam</h1>
                <p style="margin: 5px 0 0 0; opacity: 0.9;">Log in to build your dream team</p>
            </div>
            <form class="login-form" onsubmit="event.preventDefault(); window.location.href='home.html';">
                <input type="email" placeholder="Trainer Email (e.g. ash@pallet.com)" required>
                <input type="password" placeholder="Secret Code (Password)" required>
                <button type="submit" class="btn btn-green" style="margin-top: 10px; font-size: 16px;">Enter PC System</button>
            </form>
        </div>
    </div>
</body>
</html>
