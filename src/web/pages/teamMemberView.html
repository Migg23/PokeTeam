<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Team - PokeTeam</title>
    <link rel="stylesheet" href="../stylesheets/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen bg-gray-50 overflow-hidden" id="builder-view">

    <div class="w-72 bg-white border-r-2 border-gray-200 flex flex-col z-30 shadow-md">
        <div class="p-4 bg-red-600 border-b-4 border-gray-900 text-white font-black uppercase text-xl text-center">
            Pokédex
        </div>
        <div class="p-3 bg-gray-100 border-b border-gray-200">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
                <input type="text" id="pokedex-search" placeholder="Search Pokémon..." class="w-full pl-9 pr-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm">
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="pokedex-list"></div>
    </div>

    <div class="flex-1 flex flex-col overflow-y-auto">
        
        <div class="bg-white border-b-2 border-gray-200 p-4 flex items-center gap-4 sticky top-0 z-20 shadow-sm">
            <a href="myTeams.html" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors inline-block">
                <i data-lucide="arrow-left" class="w-5 h-5 text-gray-700"></i>
            </a>
            <input type="text" id="team-name-input" oninput="updateTeamName(this.value)" class="text-2xl font-black text-gray-800 uppercase tracking-wide bg-transparent border-b-2 border-transparent hover:border-gray-300 focus:outline-none focus:border-blue-500 px-2 py-1 w-96" />
        </div>
        
        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-5xl mx-auto" id="team-grid">
                <div id="slot-0" ondrop="drop(event, 0)" ondragover="allowDrop(event)"></div>
                <div id="slot-1" ondrop="drop(event, 1)" ondragover="allowDrop(event)"></div>
                <div id="slot-2" ondrop="drop(event, 2)" ondragover="allowDrop(event)"></div>
                <div id="slot-3" ondrop="drop(event, 3)" ondragover="allowDrop(event)"></div>
                <div id="slot-4" ondrop="drop(event, 4)" ondragover="allowDrop(event)"></div>
                <div id="slot-5" ondrop="drop(event, 5)" ondragover="allowDrop(event)"></div>
            </div>
        </div>
    </div>

    <script src="../scripts/scripts.js"></script>
</body>
</html>
