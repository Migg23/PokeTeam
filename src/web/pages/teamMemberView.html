<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Team - PokeTeam</title>
    <link rel="stylesheet" href="../stylesheets/style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex h-screen bg-gray-50 overflow-hidden" id="builder-view">

    <div class="w-72 bg-white border-r-2 border-gray-200 flex flex-col z-30 shadow-md">
        <div class="p-4 bg-red-600 border-b-4 border-gray-900 text-white font-black uppercase text-xl text-center">
            Pokédex
        </div>
        
        <div class="p-3 bg-gray-100 border-b border-gray-200">
            <button onclick="openSearchModal(null)" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center justify-center gap-2 shadow-md transition-colors uppercase tracking-wider text-sm">
                <i data-lucide="search" class="w-4 h-4"></i> Advanced Search
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="pokedex-list">
            </div>
    </div>

    <div class="flex-1 flex flex-col overflow-y-auto relative">
        <div class="bg-white border-b-2 border-gray-200 p-4 flex items-center gap-4 sticky top-0 z-20 shadow-sm">
            <a href="myteams.html" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors inline-block">
                <i data-lucide="arrow-left" class="w-5 h-5 text-gray-700"></i>
            </a>
            <input type="text" id="team-name-input" onchange="updateTeamName(this.value)" class="text-2xl font-black text-gray-800 uppercase tracking-wide bg-transparent border-b-2 border-transparent hover:border-gray-300 focus:outline-none focus:border-blue-500 px-2 py-1 w-96" />
        </div>
        
        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-5xl mx-auto" id="team-grid">
                <div id="slot-0" ondrop="drop(event, 0)" ondragover="allowDrop(event)"></div>
                <div id="slot-1" ondrop="drop(event, 1)" ondragover="allowDrop(event)"></div>
                <div id="slot-2" ondrop="drop(event, 2)" ondragover="allowDrop(event)"></div>
                <div id="slot-3" ondrop="drop(event, 3)" ondragover="allowDrop(event)"></div>
                <div id="slot-4" ondrop="drop(event, 4)" ondragover="allowDrop(event)"></div>
                <div id="slot-5" ondrop="drop(event, 5)" ondragover="allowDrop(event)"></div>
            </div>
        </div>
    </div>

    <div id="full-screen-search" class="fixed inset-0 bg-white z-50 hidden flex-col">
        <div class="p-4 bg-red-600 flex justify-between items-center text-white border-b-4 border-gray-900 shadow-md z-10">
            <h2 class="text-2xl font-black uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="search" class="w-6 h-6"></i> Search Database
            </h2>
            <button onclick="closeSearchModal()" class="p-2 bg-red-800 rounded-lg hover:bg-red-900 transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div class="flex flex-1 overflow-hidden">
            <div class="w-80 bg-gray-100 p-6 border-r-2 border-gray-300 overflow-y-auto shadow-[inset_-4px_0_10px_rgba(0,0,0,0.05)]">
                <div class="mb-6">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-2">Search Name</label>
                    <input type="text" id="modal-search-text" oninput="applyModalFilters()" placeholder="e.g. Charizard..." class="w-full p-3 rounded-lg border-2 border-gray-300 focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-200">
                </div>

                <div class="mb-6 bg-white p-3 rounded-lg border-2 border-gray-200">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Level</label>
                        <span id="modal-level-display" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">50</span>
                    </div>
                    <input type="range" id="modal-level-slider" min="1" max="100" value="50" class="w-full cursor-pointer accent-red-500" oninput="document.getElementById('modal-level-display').textContent = this.value">
                </div>

                <div class="mb-6">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-2">Natures (Applies to Selection)</label>
                    <div id="modal-natures-container" class="grid grid-cols-2 gap-2 text-sm bg-white p-3 rounded-lg border-2 border-gray-200 h-40 overflow-y-auto">
                        </div>
                </div>

                <div class="mb-6">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-2">Exclusive Abilities</label>
                    <div id="modal-abilities-container" class="space-y-2 text-sm bg-white p-3 rounded-lg border-2 border-gray-200 h-64 overflow-y-auto">
                        </div>
                </div>
            </div>

            <div class="flex-1 p-8 overflow-y-auto bg-gray-50 relative">
                <div id="modal-results" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    </div>
            </div>
        </div>
    </div>

    <script src="../scripts/scripts.js"></script>
</body>
</html>
